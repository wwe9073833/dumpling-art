<!DOCTYPE html> 
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結帳清單｜DUMPLING ART</title> 
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cursor.css">
    <script defer src="js/cursor.js"></script>

    <style>
        /* ================= 🛒 DUMPLING ART 結帳清單 (黑化精品版) ================= */
        html { scroll-behavior: smooth; }
        body {
            /* 👉🏼 完美同步：英文優先使用 Helvetica，中文使用思源黑體 */
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0; background-color: #000; color: #fff; line-height: 1.6;
        }

        /* --- 1. 頂部導覽列 (Navbar)：✨ 已同步為首頁的高級深血紅窄版 ✨ --- */
        .navbar {
            background-color: rgba(184, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%;
            border-bottom: 1px solid #8a0000;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Noto Sans TC', sans-serif;
            font-size: 20px;
            letter-spacing: 3px;
            font-weight: 400;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }
        .nav-logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
            transform: scale(2.2);
            margin-left: -30px;
            margin-right: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: #ffcccc;
            margin-left: 25px;
            font-size: 14px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .nav-links a:hover {
            color: #fff;
        }

        /* --- 購物車標題系統：同步 Products 頁 --- */
        .page-header {
            text-align: center;
            margin: 96px 0 66px 0;
        }
        .page-title {
            position: relative;
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            font-weight: 400;
            letter-spacing: 10px;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
        }
        .page-title::after {
            content: "";
            display: block;
            width: 92px;
            height: 1px;
            margin: 24px auto 0;
            background: rgba(184, 0, 0, 0.28);
        }
        .page-subtitle {
            font-size: 12px;
            color: #7c5e5e;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 18px;
        }
        
        /* 🛒 購物車容器：改成黑色透明與精緻框線 */
        .cart-container {
            max-width: 800px; margin: 0 auto 60px auto; padding: 40px;
            background: transparent; border-radius: 12px; border: 1px solid #222;
        }
        
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px dashed #333; font-size: 16px; letter-spacing: 1px;
        }
        .item-name { font-weight: 300; color: #fff; }
        .item-subtotal { color: #ff3b3b; font-weight: bold; } /* 金額保留醒目紅色 */

        .cart-total {
            text-align: right; font-size: 24px; font-weight: 300; margin-top: 40px; color: #fff; letter-spacing: 2px;
        }

        /* 結帳按鈕：紅色膠囊 */
        .checkout-btn {
            display: block; width: 100%; text-align: center; 
            background-color: #ff3b3b; color: white; padding: 18px; 
            border-radius: 50px; font-size: 16px; font-weight: bold; letter-spacing: 2px;
            text-decoration: none; margin-top: 40px; transition: 0.4s; cursor: pointer; border: 1px solid #ff3b3b;
        }
        .checkout-btn:hover { background-color: transparent; color: #ff3b3b; }

        /* 清空按鈕：黑色膠囊 */
        .clear-btn {
            display: block; width: 100%; text-align: center; 
            background-color: #111; color: #888; padding: 15px; 
            border-radius: 50px; font-size: 14px; font-weight: 300; letter-spacing: 1px;
            text-decoration: none; margin-top: 15px; transition: 0.4s; cursor: pointer; border: 1px solid #333;
        }
        .clear-btn:hover { background-color: #222; color: #fff; border-color: #555; }

        .empty-message { text-align: center; color: #555; font-size: 16px; margin: 40px 0; letter-spacing: 1px; }

        /* 手機版排版自動堆疊 */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; padding: 15px 10px; }
            .brand-logo { font-size: 16px; margin-bottom: 15px; justify-content: center; letter-spacing: 2px; }
            .nav-logo-img { height: 28px; transform: scale(2); margin-left: -5px; margin-right: 15px; }
            .nav-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
            .nav-links a { margin: 0 5px; font-size: 13px; }
            .page-header { margin: 44px 0 36px 0; }
            .page-title { font-size: 30px; letter-spacing: 6px; }
            .page-title::after { width: 72px; margin-top: 18px; }
            .page-subtitle { margin-top: 14px; font-size: 11px; letter-spacing: 3px; }
            .cart-container { padding: 25px; margin: 20px 15px; }
            .cart-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .item-subtotal { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">
            <img src="images/DUMPLING ART.png" alt="DUMPLING ART Logo" class="nav-logo-img">
            DUMPLING ART｜OFFICIAL SITE
        </a>
        <div class="nav-links">
            <a href="index.html">繼續探索</a>
        </div>
    </nav>

    <div class="page-header">
        <h1 class="page-title">ORDER SUMMARY</h1>
        <div class="page-subtitle">你的收藏清單</div>
    </div>

    <div class="cart-container">
        
        <div id="cart-items"></div>
        
        <div class="cart-total" id="cart-total">總計：NT$ 0</div>

        <button onclick="checkoutViaLine()" class="checkout-btn">傳送訂單給餃子 (LINE)</button>
        <button onclick="clearCart()" class="clear-btn">清空收藏清單</button>
    </div>

    <script>
        let totalPrice = 0;

        function safeGetCart() {
            let rawCart = localStorage.getItem('dumpling_cart');
            if (!rawCart) {
                return [];
            }

            try {
                let parsedCart = JSON.parse(rawCart);
                if (Array.isArray(parsedCart)) {
                    return parsedCart;
                }
            } catch (error) {
                // 壞資料直接清掉，避免整個購物車頁中斷
            }

            localStorage.removeItem('dumpling_cart');
            return [];
        }

        function renderCart() {
            let cart = safeGetCart();
            
            let cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = ""; // 先清空畫面
            totalPrice = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-message">尚未收藏任何作品，<br>選擇一件讓你心動的收藏。</div>';
                document.getElementById('cart-total').innerText = "總計：NT$ 0";
                return;
            }

            // 把商品一個一個印出來
            cart.forEach(item => {
                let subtotal = item.price * item.quantity;
                totalPrice += subtotal;
                
                cartItemsDiv.innerHTML += `
                    <div class="cart-item">
                        <span class="item-name">▪️ ${item.name} (x${item.quantity})</span>
                        <span class="item-subtotal">NT$ ${subtotal}</span>
                    </div>
                `;
            });

            // 更新總金額
            document.getElementById('cart-total').innerText = `總計：NT$ ${totalPrice}`;
        }

        // 清空購物車
        function clearCart() {
            if(confirm("確定要清空購物車嗎？")) {
                localStorage.removeItem('dumpling_cart');
                renderCart(); // 💡 清空後馬上重新整理畫面
                alert("購物車已清空！");
            }
        }

        // 🚀 終極魔法：LINE 自動點餐機
        function checkoutViaLine() {
            let cart = safeGetCart();
            
            if (cart.length === 0) {
                alert("購物車是空的，無法結帳喔！");
                return;
            }

            let message = "老闆你好！這是我要訂購的商品：\n\n";
            
            cart.forEach(item => {
                let subtotal = item.price * item.quantity;
                message += `▪️ ${item.name} x ${item.quantity} (NT$ ${subtotal})\n`;
            });

            message += `\n💰 總金額：NT$ ${totalPrice}\n\n`;
            message += "請協助確認訂單並提供匯款資訊，謝謝！";

            let lineId = "@659jchwf"; 
            let lineUrl = `https://line.me/R/oaMessage/${lineId}/?${encodeURIComponent(message)}`;

            window.location.href = lineUrl;
        }

        // 網頁讀取完畢後，執行顯示購物車
        window.onload = renderCart;
    </script>
</body>
</html>
